# How GitHub groups the automatically generated release notes (gh release create --generate-notes), by PR label.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Tests
      labels: [tests]
    - title: CI and build
      labels: [ci]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
